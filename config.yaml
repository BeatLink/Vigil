# Vigil Configuration Sample
#
# This is a minimal example. A full deployment (the TechNet homelab) is defined
# declaratively in NixOS via services.vigil — see that module for a complete,
# real-world plugin tree.

# Database settings
database:
  path: "vigil.db"

# Log storage settings
# Collected log lines (e.g. journald output) are stored persistently and
# deduplicated. Old lines are pruned automatically.
logging:
  retention_days: 30          # Days to keep log lines; 0 disables pruning (keep forever)
  metric_retention_days: 30   # Days to keep metrics & status history (powers charts);
                              # 0 disables. Omit to reuse retention_days above.
  # metric_downsample_days: 2 # Thin metrics older than this to one sample per
                              # hour per series — charts only read the recent
                              # tail, so this stretches retention for the same
                              # disk footprint. 0 (default) disables.
  # cycle_timings: true       # Record cycle_collect/parse_seconds metrics per
                              # monitor; they double the metric row count, so
                              # set false to shed them.

# In-memory state (optional).
# Live state is held in Python objects and served to the UI from there; the
# database is only written to (for persistence) and read once at startup.
# These bound how much history each stream keeps in memory — i.e. how far back
# a chart or table can read without a restart. The defaults already exceed
# everything the UI requests, so most deployments never need to set these.
# Raise them only to plot longer windows; each entry is a small object, so the
# cost is roughly (monitors x metrics x metric_history) objects resident.
# memory:
#   metric_history: 300       # Points kept per (monitor, metric) series
#   event_history: 2000       # Events kept globally
#   log_history: 500          # Log lines kept per target
#   job_output: 5000          # Output lines kept per job
#   jobs_per_plugin: 25       # Finished jobs kept per monitor (running ones never evicted)
#   finished_job_output: 200  # Output lines kept once a job ends (full output stays on disk)

# Metric export (optional).
# Prometheus is always available (pull) at GET /metrics — no config needed.
# InfluxDB is a push exporter: enable it here to periodically ship metrics.
# exporters:
#   influxdb:
#     url: "http://localhost:8086"
#     interval: 30            # seconds between pushes
#     # InfluxDB 2.x:
#     org: "my-org"
#     bucket: "vigil"
#     token: "my-api-token"
#     # InfluxDB 1.x (use instead of org/bucket/token):
#     # database: "vigil"

# Global SSH connection defaults.
# Merged into every plugin's `ssh_config` unless the plugin overrides a given
# key, so a single username/key can apply across all SSH-based monitors instead
# of being repeated on each one.
ssh_defaults:
  username: "beatlink"
  # key_path: "/path/to/private_key"   # optional; falls back to the SSH agent

# Theme — the dashboard is themed with Halon, whose token set lives in
# vigil/core/ui/static/halon-tokens.css. Every field here is optional; each one
# overrides a single Halon token, in both the light and the dark scheme, so an
# override that only suits one of them is yours to audit.
theme:
  scheme: auto                  # auto follows the browser; or light / dark
  # primary:          "#2563eb" # --accent: links, focus, the primary button
  # background:       "#ffffff" # --surface-default: cards and panels
  # background_muted: "#f1f5f9" # --surface-root: the page behind them
  # text:             "#1a1a2e" # --text-body
  # text_muted:       "#475569" # --text-secondary: labels and captions
  # status_online:    "#047857" # --status-success
  # status_warning:   "#c2410c" # --status-warning-text
  # status_failed:    "#dc2626" # --status-danger
  # status_offline:   "#64748b" # --text-tertiary

# Domain-based Plugins
plugins:
  - name: "Devices"
    type: "group"
    children:
      - name: "My Server"
        id: "my-server"
        type: "uptime"
        target_host: "server.example.com"
        interval: 30s

  # A group with a `layout:` stops wrapping its children in collapsible cards and
  # builds its own rows instead, one child widget per cell, addressed as
  # "<child_id>.<widget_name>". "<child_id>.status" is a status card the group
  # draws itself; a bare "<child_id>" renders that child whole. Widgets the
  # layout does not name are not rendered at all.
  # - name: "Fleet Overview"
  #   type: "group"
  #   layout:
  #     - - "my-server.status"
  #       - widget: "server-cpu.cpu_card"
  #         title: "SERVER CPU"          # override the widget's own heading
  #     - - widget: "server-cpu.cpu_chart"
  #         height: "300px"
  #         flex: 2                      # twice the width of its row neighbour
  #       - "server-disk-root.usage_card"
  #   children:
  #     - ...

  - name: "My Server Stats"
    type: "group"
    children:
      # One monitor per signal: each keeps its own status, interval and history,
      # and the group above rolls them up to the worst of them.
      - name: "CPU"
        id: "server-cpu"
        type: "cpu"
        interval: 1m
        warning: 70              # CPU % (warn / fail)
        threshold: 85
        ssh_config:
          host: "server.example.com"
      - name: "Memory"
        id: "server-memory"
        type: "memory"
        interval: 1m
        warning: 75              # memory % (warn / fail)
        threshold: 90
        ssh_config:
          host: "server.example.com"
      - name: "Load"
        id: "server-load"
        type: "load"
        interval: 1m
        warning: 70              # 1m load as % of cores (warn / fail)
        threshold: 100
        ssh_config:
          host: "server.example.com"
      - name: "Temperature"
        id: "server-temperature"
        type: "temperature"
        interval: 1m
        warning: 70              # °C (warn / fail)
        threshold: 80
        ssh_config:
          host: "server.example.com"
      - name: "OOM Kills"
        id: "server-oom"
        type: "oom"
        interval: 1m
        alert_for: 3             # collections a kill keeps the monitor alerting
        ssh_config:
          host: "server.example.com"
      - name: "/"
        id: "server-disk-root"
        type: "disk_space"
        path: "/"
        threshold: 90
        interval: 10m
        ssh_config:
          host: "server.example.com"

  - name: "Services"
    type: "group"
    children:
      - name: "Nginx"
        id: "server-nginx"
        type: "systemd_service"
        interval: 1m
        service_name: "nginx.service"
        ssh_config:
          host: "server.example.com"

  - name: "Backups"
    type: "group"
    children:
      - name: "Nightly Backup"
        id: "server-backup"
        type: "borg"
        interval: 1h
        max_age: 1d
        repo: "/path/to/borg/repo"
        # passphrase_command: "cat /etc/vigil/borg.pass"   # for encrypted repos
        # require_sudo: true   # for a root-only repo; needs passwordless sudo
        #                      # for borg on the target host
        # collect_stats: true  # also run `borg info` for size/dedup metrics

        # --- Backup configuration -------------------------------------------
        # Setting source_paths enables the "Run Backup" / "Dry Run" actions.
        # Monitoring works without any of this; omit it for a read-only monitor.
        # source_paths:
        #   - "/home"
        #   - "/etc"
        # exclude:
        #   - "/home/*/.cache"
        #   - "*.tmp"
        # exclude_from: "/etc/borg/excludes"   # pattern file on the target host
        # exclude_if_present: [".nobackup"]    # skip dirs containing this marker
        # exclude_caches: true                 # skip CACHEDIR.TAG dirs (default)
        # one_file_system: true                # don't cross mounts (default)
        # compression: "zstd"                  # or "lz4", "zstd,10", "none"
        # archive_prefix: "nightly"            # archives: "<prefix>-<UTC stamp>"
        # cache_dir: "/var/cache/vigil-borg"   # persistent BORG_BASE_DIR; must be
        #                                      # writable, else every backup is a
        #                                      # full re-read instead of incremental;
        #                                      # when set, monitoring polls reuse it
        #                                      # too instead of rebuilding the chunks
        #                                      # cache in a temp dir on every poll
        # backup_lock_wait: 600                # seconds to wait for the repo lock
        ssh_config:
          host: "server.example.com"

  - name: "Server I/O & Network"
    type: "group"
    children:
      # An expensive signal just gets a slower interval of its own.
      - name: "SMART"
        id: "server-smart"
        type: "smart"
        interval: 1h           # smartctl is slow and rarely changes its answer
        ssh_config:
          host: "server.example.com"
      - name: "ZFS"
        id: "server-zfs"
        type: "zfs"
        interval: 1h
        warning: 80            # pool capacity % (warn / fail)
        threshold: 90
        # pools: ["tank"]      # optional; omit to list every pool
        ssh_config:
          host: "server.example.com"
      - name: "RAID"
        id: "server-md"
        type: "md"             # mdadm arrays from /proc/mdstat
        interval: 10m
        ssh_config:
          host: "server.example.com"
      - name: "Disk I/O"
        id: "server-disk-io"
        type: "disk_io"
        interval: 30s
        # device: "nvme0n1"    # omit to auto-detect the busiest disk
        ssh_config:
          host: "server.example.com"
      - name: "Interrupts"
        id: "server-interrupts"
        type: "interrupts"
        interval: 1m
        warning: 20000         # interrupts/sec
        threshold: 50000
        ssh_config:
          host: "server.example.com"
      - name: "Throughput"
        id: "server-throughput"
        type: "throughput"
        interval: 30s
        # interface: "eth0"    # omit to auto-detect the busiest
        ssh_config:
          host: "server.example.com"
      - name: "Connections"
        id: "server-connections"
        type: "connections"
        interval: 1m
        warning: 500           # total TCP connections
        threshold: 1000
        ssh_config:
          host: "server.example.com"
      - name: "WiFi"
        id: "server-wifi"
        type: "wifi"
        interval: 1m
        # interface: "wlan0"     # optional; auto-detects the strongest link
        quality_warning: 40      # link quality floor (warn below)
        quality_threshold: 20    # link quality floor (fail below)
        ssh_config:
          host: "server.example.com"

  - name: "Reachability"
    type: "group"
    children:
      - name: "Port & URL Checks"
        id: "server-ports"
        type: "ports"
        interval: 1m
        timeout: 5             # per-check timeout (seconds)
        checks:
          - name: "SSH"        # TCP check (bash /dev/tcp)
            host: "server.example.com"
            port: 22
          - name: "API Health" # URL check (curl; 2xx/3xx = up)
            url: "https://api.example.com/health"
        ssh_config:
          host: "server.example.com"

  - name: "GPU & Containers"
    type: "group"
    children:
      - name: "GPU"
        id: "server-gpu"
        type: "gpu"
        interval: 1m
        util_warning: 85       # GPU util % (warn / fail)
        util_threshold: 95
        mem_warning: 85        # VRAM % (warn / fail)
        mem_threshold: 95
        temp_warning: 80       # °C (warn / fail)
        temp_threshold: 90
        ssh_config:
          host: "server.example.com"   # target needs nvidia-smi
      - name: "Docker"
        id: "server-docker"
        type: "containers"
        interval: 1m
        runtime: "docker"      # or "podman"
        expect_running:        # these must be up, else failed; also gives Restart actions
          - "nginx"
          - "postgres"
        stopped_warning: true  # any other stopped container -> warning
        ssh_config:
          host: "server.example.com"

  - name: "Custom Checks"
    type: "group"
    children:
      - name: "Cert Expiry (days)"
        id: "server-cert-expiry"
        type: "command"
        interval: 6h
        # Extract a number from stdout and threshold it. `invert: true` means
        # LOWER is worse (fewer days left = more urgent).
        command: >
          days=$(( ( $(date -d "$(openssl x509 -enddate -noout -in /etc/ssl/cert.pem | cut -d= -f2)" +%s) - $(date +%s) ) / 86400 ));
          echo "days=$days"
        pattern: 'days=(-?\d+)'
        warning: 21            # warn when <= 21 days
        threshold: 7           # fail when <= 7 days
        invert: true
        value_label: "DAYS LEFT"
        value_unit: " d"
        ssh_config:
          host: "server.example.com"
      - name: "Reboot Required"
        id: "server-reboot-required"
        type: "command"
        interval: 1h
        # No pattern -> status is driven by exit code (0 = online, non-zero = below).
        command: "test ! -f /var/run/reboot-required"
        nonzero_is_warning: true   # reboot pending -> warning, not failed
        ssh_config:
          host: "server.example.com"

  - name: "Storage & VMs"
    type: "group"
    children:
      - name: "Filesystems"
        id: "server-filesystems"
        type: "filesystems"    # auto-discovers ALL real mounts (no per-path config)
        interval: 5m
        warning: 80            # usage % (warn / fail), applied to every filesystem
        threshold: 90
        ssh_config:
          host: "server.example.com"
      - name: "Folders"
        id: "server-folders"
        type: "folders"        # watch sizes of arbitrary directories via du
        interval: 1h
        folders:
          - path: "/var/log"
            warning: 5          # GB (warn / fail)
            threshold: 10
          - path: "/srv/media"  # size-only (no thresholds) — just track growth
        ssh_config:
          host: "server.example.com"
      - name: "Virtual Machines"
        id: "server-vms"
        type: "vms"            # libvirt/KVM via virsh
        interval: 1m
        # uri: "qemu:///system"       # optional; this is the default
        expect_running:               # these must be up, else failed; gives Start/Shutdown actions
          - "web"
        ssh_config:
          host: "server.example.com"

  - name: "Cloud"
    type: "group"
    children:
      - name: "Instance Metadata"
        id: "server-cloud"
        type: "cloud"          # detects AWS/GCP/Azure via the metadata endpoint
        interval: 15m
        provider: "auto"       # or "aws" / "gcp" / "azure"
        ssh_config:
          host: "server.example.com"
