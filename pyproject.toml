[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil"
version = "0.1.0"
description = "A lightweight, pluggable network and system monitor for Linux"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
    # httpx serves the async HTTP connector; requests remains for the sync
    # InfluxDB push exporter.
    "httpx>=0.27",
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "peewee>=3.17.1",
    # The floor is the tested major: the UI touches private NiceGUI surface
    # (see vigil/core/ui/nicegui_compat.py), so an unmanaged major bump is the
    # likeliest way the dashboard breaks.
    "nicegui>=3.12,<4",
    "dnspython>=2.6.0",
    # Native async SSH transport (see vigil/core/connectors/ssh_connector.py) —
    # replaces shelling out to the system `ssh` client with a persistent
    # asyncssh connection per host, removing the fork/exec cost and the
    # collector's old thread-pool/semaphore ceiling.
    "asyncssh>=2.14.0",
    # The agent transport's client half (see vigil_agent/client.py). The
    # server side needs nothing extra: NiceGUI already brings FastAPI and
    # uvicorn, which serve the agent WebSocket on the dashboard's own port.
    "websockets>=12.0",
]

[project.scripts]
vigil = "vigil.__main__:main"
vigil-agent = "vigil_agent.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
line-length = 100
# Vendored third-party code is out of scope for every rule.
extend-exclude = ["lnxlink"]

[tool.ruff.lint]
# A ratchet, not an aspiration: docstring presence, indentation, unused
# imports, and a complexity ceiling pinned at today's worst case (21) so the
# set only ever tightens.
select = ["E1", "W", "F401", "D100", "D103", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 21

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D100", "F401"]
"tests/**" = ["D100", "D103"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vigil*", "vigil_agent*"]

[tool.setuptools.package-data]
vigil = ["core/ui/static/*"]